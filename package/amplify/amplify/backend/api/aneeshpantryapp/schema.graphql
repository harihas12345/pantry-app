type PantryItem @model @auth(rules: [
  { allow: public, operations: [read] },
  { allow: groups, groups: ["Parents"], operations: [create, update, delete, read] }
]) {
  id: ID!
  name: String!
  quantity: Int!
  category: String
  image: String
}

type RestockRequest @model @auth(rules: [
  { allow: public, operations: [create] },
  { allow: groups, groups: ["Parents"], operations: [read, delete] }
]) {
  id: ID!
  itemName: String!
  reason: String
  date: AWSDateTime
}
